# Compila ZENO en un Mac de GitHub para comprobar que no hay errores.
# No firma ni publica nada: solo compila para el simulador.
name: Compilar ZENO

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version
      - name: Compilar para el simulador
        run: |
          set -o pipefail
          xcodebuild -project ZENO.xcodeproj -target ZENO -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee compilacion.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" compilacion.log
      - name: Errores
        if: failure()
        run: grep -E "error:" compilacion.log | sort -u | head -80
      - name: Capturas en el simulador
        run: |
          APP=$(find . -name ZENO.app -path "*iphonesimulator*" | head -1)
          ID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$ID"
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          mkdir -p capturas
          captura () {  # nombre, argumentos...
            nombre=$1; shift
            xcrun simctl terminate "$ID" app.zeno.ZENO 2>/dev/null || true
            xcrun simctl launch "$ID" app.zeno.ZENO -datosDeEjemplo YES "$@"
            sleep 11
            xcrun simctl io "$ID" screenshot "capturas/$nombre.png"
          }
          captura 1-hoy
          captura 2-tareas -paginaInicial tareas
          captura 3-ajustes -paginaInicial ajustes
          captura 4-ajustes-abajo -paginaInicial ajustes -bajarAjustes YES
          captura 5-hoy-ingles -AppleLanguages "(en)" -idioma en
          ls -la capturas
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          retention-days: 7
