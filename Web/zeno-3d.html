];

/* ═════ La semilla y la apariencia: copia exacta de Semilla.swift y AparienciaLumi.swift (cielo azul) ═════ */
window.ZENO_APARIENCIA = (() => {
  const M = (1n << 64n) - 1n;
  function semilla(nombre, a, m, d) {
    const limpio = nombre.trim().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const bytes = new TextEncoder().encode(`${limpio}|${a}-${m}-${d}`);
    let h = 0xcbf29ce484222325n;
    for (const b of bytes) { h ^= BigInt(b); h = (h * 0x100000001b3n) & M; }
    return h;
  }
  function generador(s) {
    let e = s;
    const sig = () => {
      e = (e + 0x9e3779b97f4a7c15n) & M;
      let z = e;
      z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & M;
      z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & M;
      return z ^ (z >> 31n);
    };
    const unidad = () => Number(sig() >> 11n) / 2 ** 53;
    return { unidad, entre: (x, y) => x + (y - x) * unidad(), entero: (lo, hi) => lo + Number(sig() % BigInt(hi - lo + 1)) };
  }
  const hsb = (h, s, b) => {
    const t6 = (h - Math.floor(h)) * 6, i = Math.floor(t6), f = t6 - i;
    const p = b * (1 - s), q = b * (1 - s * f), t = b * (1 - s * (1 - f));
    return [[b, t, p], [q, b, p], [p, b, t], [p, q, b], [t, p, b], [b, p, q]][i % 6];
  };
  function apariencia(sem) {
    const g = generador(sem);
    const hN = g.entre(.115, .135), sN = g.entre(.26, .36);
    const hC = g.entre(.112, .132), sC = g.entre(.50, .62);
    let tonoHalo = g.unidad();
    if (tonoHalo > .10 && tonoHalo < .64) tonoHalo = tonoHalo < .30 ? .10 : .64;
    const sH = g.entre(.42, .68);
    const lobulos = g.entero(3, 7);
    const profundidad = g.entre(.09, .22);
    const sentido = g.unidad() < .5 ? -1 : 1;
    const respira = g.entre(4.2, 6.4);
    const u = g.unidad();
    const tono = .585 + .085 * u;
    const sF = g.entre(.66, .80), bF = g.entre(.175, .215);
    const vecino = tono + g.entre(-.07, .07);
    const sNu = g.entre(.52, .70), bNu = g.entre(.40, .50);
    const ub = g.unidad(), sb = g.entre(.62, .78);
    const hO = g.entre(.100, .130), sO = g.entre(.45, .60);
    const dx = g.entre(0, 60), dy = g.entre(0, 60);
    const ola = g.entero(0, 3);
    const incl = g.entre(.36, 1.0), giroOrb = g.entre(0, Math.PI), flote = g.entre(.55, 1.45);
    return {
      nucleo: hsb(hN, sN, 1), corona: hsb(hC, sC, 1), halo: hsb(tonoHalo, sH, 1),
      coronaVecino: hsb(.108, .62, 1), nucleoVecino: hsb(.112, .34, 1),
      fondo: hsb(tono, sF, bF * 1.12), nube: hsb(vecino, sNu, bNu), brasa: hsb(.585 + .075 * ub, sb * .62, .95), oro: hsb(hO, sO, 1),
      lobulos, profundidad, sentido, respira, ola, orbita: [incl, giroOrb], flote, despl: [dx, dy], periodoLuz: 70 + 40 * dx / 60
    };
  }
  // ?nombre=Diaz&fecha=1999-06-15 dibuja la estrella de esa persona (la de ejemplo de la app, para comparar).
  const q = new URLSearchParams(location.search);
  const nombre = q.get('nombre') || 'Lumi';
  const [a, m, d] = (q.get('fecha') || '1999-06-15').split('-').map(Number);
  return { ap: apariencia(semilla(nombre, a || 1999, m || 6, d || 15)), hsb };
})();

/* ═════ Respaldo sin 3D: la estrella de la web actual, dibujada en 2D (quieta) ═════ */
window.dibujarRespaldo = function () {
  const lienzo = document.getElementById('respaldo');
  lienzo.style.display = 'block';
  document.getElementById('cargando').classList.add('fuera');
  const { ap } = window.ZENO_APARIENCIA;
  const r = Math.min(devicePixelRatio || 1, 2), w = lienzo.clientWidth, h = lienzo.clientHeight;
  lienzo.width = w * r; lienzo.height = h * r;
  const c = lienzo.getContext('2d'); c.scale(r, r);
  const rgb = (v, a) => `rgba(${v.map(x => Math.round(x * 255)).join(',')},${a})`;
  const fondo = c.createRadialGradient(w / 2, h * .42, 0, w / 2, h * .42, Math.max(w, h) * .7);
  fondo.addColorStop(0, rgb(ap.nube, 1)); fondo.addColorStop(.45, rgb(ap.fondo, 1)); fondo.addColorStop(1, '#0a0e22');
  c.fillStyle = fondo; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';
  const cx = w / 2, cy = h * .42, base = Math.min(w, h) * .32;
  let g = c.createRadialGradient(cx, cy, 0, cx, cy, base);
  g.addColorStop(0, rgb(ap.halo, .3)); g.addColorStop(1, rgb(ap.halo, 0)); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const n = ap.lobulos + 1;
  for (let i = 0; i < n * 2; i++) {
    const corto = i % 2, ang = Math.PI * 2 * Math.floor(i / 2) / n + (corto ? Math.PI / n : 0) + ap.despl[1];
    const L = base * (corto ? .35 : .8), ex = cx + Math.cos(ang) * L, ey = cy + Math.sin(ang) * L;
    const lg = c.createLinearGradient(cx, cy, ex, ey);
    lg.addColorStop(0, 'rgba(255,247,230,.85)'); lg.addColorStop(1, rgb(ap.corona, 0));
    c.strokeStyle = lg; c.lineWidth = corto ? .8 : 1.2; c.beginPath(); c.moveTo(cx, cy); c.lineTo(ex, ey); c.stroke();
  }
  g = c.createRadialGradient(cx, cy, 0, cx, cy, base * .2);
  g.addColorStop(0, 'rgba(255,250,238,1)'); g.addColorStop(.3, rgb(ap.nucleo, .9)); g.addColorStop(1, rgb(ap.nucleo, 0));
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, base * .2, 0, 6.283); c.fill();
};

<script type="module">
/* ═════ ZENO en 3D ═════ */
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const modoPlay = params.has('play');
const vertical = params.has('vertical');
if (modoPlay) document.body.classList.add('play');
if (vertical) document.body.classList.add('vertical');

function hayWebGL() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
}

const PARTES = window.PARTES;
const { ap, hsb } = window.ZENO_APARIENCIA;
const panel = document.getElementById('panel');
const pestanas = document.getElementById('pestanas');
const botonDespiece = document.getElementById('despiece');

function mostrarPanel(parte) {
  panel.classList.add('cambia');
  setTimeout(() => {
    document.getElementById('panel-titulo').innerHTML = parte ? parte.titulo : 'Una sola cosa. <em>Ahora.</em>';
    document.getElementById('panel-l1').textContent = parte ? parte.l1 : 'ZENO te acompaña con una estrella que nace contigo.';
    document.getElementById('panel-l2').textContent = parte ? parte.l2 : 'Toca una parte para verla de cerca.';
    panel.classList.remove('cambia');
  }, quieto ? 0 : 220);
}

PARTES.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.nombre; b.dataset.id = p.id; b.setAttribute('aria-pressed', 'false');
  pestanas.appendChild(b);
});

if (!hayWebGL() || params.has('sin3d')) {
  window.dibujarRespaldo();
  // Sin 3D las pestañas siguen contando cada parte.
  pestanas.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...pestanas.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    mostrarPanel(PARTES.find(p => p.id === b.dataset.id));
  });
  botonDespiece.hidden = true;
} else {
  // Three.js se carga solo aquí, cuando el navegador puede dibujar en 3D.
  import('three').then(async (THREE) => {
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    await document.fonts.ready.catch(() => {});
    iniciar(THREE, OrbitControls);
  }).catch(() => window.dibujarRespaldo());
}

function iniciar(THREE, OrbitControls) {
  const escena = document.getElementById('escena');
  const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);

  /* — Render — */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x0b1024, 1);
  renderer.autoClear = false;
  escena.insertBefore(renderer.domElement, escena.firstChild);
  renderer.domElement.setAttribute('aria-hidden', 'true');
  let dprMax = Math.min(devicePixelRatio || 1, 2), dpr = dprMax;
  renderer.setPixelRatio(dpr);
  // Un solo bucle de dibujo; se pide un cuadro cuando algo cambia (y siempre, si hay movimiento).
  let pendiente = false, anterior = performance.now(), cuadro = 0, inicioPlay = performance.now();
  function pedir() { if (!pendiente) { pendiente = true; requestAnimationFrame(dibujar); } }

  const camara = new THREE.PerspectiveCamera(38, 1, .05, 100);
  const INICIO = new THREE.Vector3(0, .55, 6.4);
  camara.position.copy(INICIO);
  const controles = new OrbitControls(camara, renderer.domElement);
  controles.enableDamping = true; controles.dampingFactor = .06;
  controles.enablePan = false; controles.minDistance = 2.4; controles.maxDistance = 11;
  controles.autoRotate = !quieto && !modoPlay; controles.autoRotateSpeed = .45;
  controles.rotateSpeed = .6; controles.zoomSpeed = .7;
  if (modoPlay) controles.enabled = false;

  const mundo = new THREE.Scene();

  /* ═════ La nebulosa: el shader de la app, a pantalla completa (a media resolución, 30 cuadros: como en la app) ═════ */
  const GLSL_RUIDO = `
  float azar(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float ruido(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
    float a=azar(i), b=azar(i+vec2(1.,0.)), c=azar(i+vec2(0.,1.)), d=azar(i+vec2(1.,1.));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
  float nube(vec2 p){ float v=0.0, amp=0.5; for(int i=0;i<4;i++){ v+=amp*ruido(p); p=vec2(p.x*1.6-p.y*1.2, p.x*1.2+p.y*1.6)+7.3; amp*=0.5; } return v/0.9375; }
  vec2 gradiente(vec2 p){ float h=azar(p)*6.2831853; return vec2(cos(h), sin(h)); }
  float perlin(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
    float a=dot(gradiente(i), f), b=dot(gradiente(i+vec2(1.,0.)), f-vec2(1.,0.));
    float c=dot(gradiente(i+vec2(0.,1.)), f-vec2(0.,1.)), d=dot(gradiente(i+vec2(1.,1.)), f-vec2(1.,1.));
    return clamp(0.5+0.72*mix(mix(a,b,u.x), mix(c,d,u.x), u.y), 0.0, 1.0); }
  float gasN(vec2 p, int capas){ float v=0.0, amp=0.5, total=0.0;
    for(int i=0;i<6;i++){ if(i>=capas) break; v+=amp*perlin(p); total+=amp; p=vec2(p.x*1.62-p.y*1.18, p.x*1.18+p.y*1.62)+11.7; amp*=0.52; }
    return v/total; }
  `;
  const nebulosaFrag = `
  precision highp float;
  uniform vec2 tam; uniform vec2 centro; uniform float t; uniform vec2 inclina; uniform vec2 desplazamiento;
  uniform float energia; uniform float calidez; uniform vec3 cFondo; uniform vec3 cNube; uniform vec3 cBrasa; uniform vec3 cOro;
  uniform float escalaPx;
  ${GLSL_RUIDO}
  float crestas(vec2 p){ float v=0.0, amp=0.5, total=0.0;
    for(int i=0;i<4;i++){ float c=1.0-abs(2.0*perlin(p)-1.0); v+=amp*c*c; total+=amp; p=vec2(p.x*1.7-p.y*1.1, p.x*1.1+p.y*1.7)+5.3; amp*=0.5; }
    return v/total; }

    grupoEstrellas.children.forEach(sp => { sp.material.opacity = .45 + .3 * Math.sin(tt * .8 + sp.userData.fase); });
    llenarAnillo(quieto ? .62 : ((tt % 25) / 25));
    // El anillo no se ve en la vista normal (Diaz): solo aparece al elegir "Tiempo visible" o al ver por dentro.
    const kT = suave(partes.tiempo.k);
    grupoTiempo.visible = kT > .01;
    aroBase.material.opacity = .22 * kT; arco.material.opacity = .62 * kT;
    grupoCerebro.rotation.y = tt * .05;

    // La nebulosa sigue a Lumi en la pantalla y se mueve un poco al girar (como al inclinar el iPhone).
    const [lx, ly] = aPantalla(grupoLumi.getWorldPosition(new THREE.Vector3()), ancho, alto);
    uNeb.centro.value.set(lx, ly);
    const esf = new THREE.Spherical().setFromVector3(camara.position.clone().sub(controles.target));
    uNeb.inclina.value.set(Math.sin(esf.theta) * .9, (esf.phi - Math.PI / 2) * .9);
    uNeb.t.value = tt;
    // Lumi se dibuja al tamaño en píxeles con que se ve (para que su centro quede nítido).
    const d = camara.position.distanceTo(grupoLumi.position);
    const pxPorUnidad = alto / (2 * Math.tan(camara.fov * Math.PI / 360) * d);
    uLumi.tam.value.set(TAM_LUMI * pxPorUnidad, TAM_LUMI * pxPorUnidad);

    renderer.clear();
    if (cuadro % 2 === 1 || quieto || cuadro < 3) { renderer.setRenderTarget(rtNeb); renderer.render(escenaNeb, camOrto); renderer.setRenderTarget(null); }
    renderer.render(escenaCopia, camOrto);
    renderer.clearDepth();
    renderer.render(mundo, camara);

    // Etiquetas: con despiece, cada parte con su línea fina. Si dos chocan, se separan en vertical.
    const colocadas = [];
    PARTES.forEach(p => {
      const et = etiquetas[p.id], pa = partes[p.id];
      const ve = pa.k > .55 && (abierto || modoPlay ? pa.k > .55 : elegida === p.id);
      const ancla = pa.ancla.clone().addScaledVector(dirEscalada.copy(pa.dir).multiply(escalaDespiece), p.id === 'nebulosa' ? 0 : suave(pa.k));
      const [x, y, delante] = aPantalla(ancla, ancho, alto);
      const cx = ancho / 2, cy = alto / 2;
      let dx = x - cx, dy = y - cy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      // Las etiquetas nunca tapan el texto de abajo.
      const limiteAbajo = document.getElementById('panel').getBoundingClientRect().top - escena.getBoundingClientRect().top - 24;
      const ex = Math.min(Math.max(x + dx * 70, 70), ancho - 70);
      let ey = Math.min(Math.max(y + dy * 46, 90), limiteAbajo);
      if (ve && delante) {
        for (let vuelta = 0; vuelta < 6; vuelta++) {
          const choca = colocadas.find(c => Math.abs(c[0] - ex) < 130 && Math.abs(c[1] - ey) < 32);
          if (!choca) break;
          ey = ey > choca[1] || ey + 34 > limiteAbajo ? choca[1] - 34 : choca[1] + 34;
          if (ey > limiteAbajo) ey = choca[1] - 34;
        }
        colocadas.push([ex, ey]);
      }
      const mostrar = ve && delante;
      et.div.classList.toggle('ve', mostrar);
      et.div.style.left = ex + 'px'; et.div.style.top = ey + 'px';
      et.linea.setAttribute('x1', x); et.linea.setAttribute('y1', y); et.linea.setAttribute('x2', ex); et.linea.setAttribute('y2', ey);
      et.linea.style.opacity = mostrar ? 1 : 0; et.punto.setAttribute('cx', x); et.punto.setAttribute('cy', y); et.punto.style.opacity = mostrar ? 1 : 0;
    });

    if (cuadro >= 2) document.getElementById('cargando').classList.add('fuera');
    // ?fps muestra los cuadros por segundo y la calidad (para medir en un teléfono).
    if (medidor && cuadro % 30 === 0) medidor.textContent = `${Math.round(1000 / Math.max(1, muestras.slice(-30).reduce((a, b) => a + b, 0) / Math.max(1, muestras.slice(-30).length)))} fps · píxeles ${dpr.toFixed(2)} · cielo ${escalaNeb.toFixed(2)}`;
    if (!quieto) pedir();
    else if (viaje || cuadro < 3) pedir();
  }
  pedir();
}
</script>
